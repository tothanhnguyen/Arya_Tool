[project]
name = "laplace-demon"
version = "0.1.0"
description = "Laplace's Demon - AI Agent nhan yeu cau qua Telegram, tu lap ke hoach va goi tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "aiogram>=3.7",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "openai>=1.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["laplace*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Tools va bot handlers chu dich bat Exception rong: contract la khong raise ra ngoai
ignore = ["BLE001", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
